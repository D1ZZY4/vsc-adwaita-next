name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, format, test, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test tests/

      - name: Build themes
        run: bun run build:themes

      - name: Check that generated themes are up to date
        run: |
          if [ -n "$(git status --porcelain themes/)" ]; then
            echo "::error::themes/ is out of date. Run 'bun run build:themes' and commit the result."
            git status --porcelain themes/
            exit 1
          fi

      - name: Validate manifest, themes, tokens and icons
        run: bun run validate

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package
        run: bun run package

      - name: Inspect package contents
        run: |
          bunx --bun @vscode/vsce ls --tree
          echo "---"
          for forbidden in src scripts tests .github node_modules bun.lock; do
            if bunx --bun @vscode/vsce ls --tree | grep -q "^$forbidden"; then
              echo "::error::package unexpectedly contains $forbidden"
              exit 1
            fi
          done
          echo "package contents look correct"

      - name: Verify the packaged icon is a PNG
        run: |
          bunx --bun @vscode/vsce ls | grep -q '^assets/icon.png$' || {
            echo "::error::assets/icon.png is missing from the package"
            exit 1
          }
          file dist/*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsc-adwaita-next-vsix
          path: dist/*.vsix
          if-no-files-found: error
