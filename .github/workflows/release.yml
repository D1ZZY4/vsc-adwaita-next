name: Release

# Publishing is deliberately tag driven and, for the marketplaces, requires an
# explicit manual trigger. Nothing here runs on a push to main.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish to the Visual Studio Marketplace
        type: boolean
        default: false
      publish_openvsx:
        description: Publish to Open VSX
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build
        run: bun run build

      - name: Package
        run: bun run package

      - name: Check that the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(bun -e 'console.log(require("./package.json").version)')"
          echo "tag: $TAG, package.json: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsc-adwaita-next-release
          path: dist/*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vsc-adwaita-next-release
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish:
    name: Publish to marketplaces
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_marketplace || inputs.publish_openvsx
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package
        run: |
          bun run build
          bun run package

      - name: Publish to the Visual Studio Marketplace
        if: inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx --bun @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx --bun ovsx publish --no-dependencies --pat "$OVSX_PAT"
