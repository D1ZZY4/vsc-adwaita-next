version: 2

updates:
  # Keep the build and validation tooling current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      typescript-tooling:
        patterns:
          - typescript
          - "@types/*"
      quality-tooling:
        patterns:
          - "@biomejs/*"
      packaging:
        patterns:
          - "@vscode/*"
    commit-message:
      prefix: "chore(deps)"

  # Keep the GitHub Actions themselves current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
